<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aryan OS · Progress</title>
<style>
  html,body{height:100%;margin:0;background:transparent}
  .card{position:relative;box-sizing:border-box;min-height:100%;padding:18px 22px 20px;border-radius:12px;overflow:hidden;color:#E8EAF0;
    font-family:-apple-system,"SF Pro Display","Avenir Next","Helvetica Neue",Helvetica,sans-serif;
    background:linear-gradient(135deg,#0B0E13 0%,#161B24 100%)}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 85% at 80% 30%,rgba(47,93,168,.55),transparent 70%),
               radial-gradient(35% 55% at 12% 95%,rgba(201,162,39,.22),transparent 70%)}
  .grain{position:absolute;inset:0;opacity:.09;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .head{position:relative;display:flex;justify-content:space-between;align-items:baseline}
  .label{font:500 10px/1 Menlo,"SF Mono",ui-monospace,monospace;letter-spacing:.32em;color:rgba(232,234,240,.55);text-transform:uppercase}
  .upd{font:400 10px/1 Menlo,"SF Mono",ui-monospace,monospace;color:rgba(232,234,240,.35);letter-spacing:.06em}
  .hair{position:relative;width:96px;height:1px;background:rgba(255,255,255,.12);margin:10px 0 16px}
  .row{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tile{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-width:0}
  .ring{width:54px;height:54px}
  .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
  .ring .bg{stroke:rgba(255,255,255,.09)}
  .ring .fg{transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
  .num{font-weight:200;font-size:30px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .num small{font-size:13px;font-weight:300;color:rgba(232,234,240,.45)}
  .cap{margin-top:5px;font-size:11px;color:rgba(232,234,240,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{display:grid;align-content:center;min-width:0}
  .count .num{font-size:34px}
  .note{position:relative;margin-top:12px;font:400 10px/1 Menlo,"SF Mono",ui-monospace,monospace;color:rgba(232,234,240,.35);letter-spacing:.06em}
  @media (max-width:560px){.row{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
  @media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div><div class="grain"></div>
  <div class="head"><div class="label">Aryan OS · Progress</div><div class="upd" id="upd"></div></div>
  <div class="hair"></div>
  <div class="row" id="row"></div>
  <div class="note" id="note">&nbsp;</div>
</div>
<script>
const R=22, C=2*Math.PI*R;
function ring(id,color){return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="bg" cx="27" cy="27" r="${R}"/><circle class="fg" id="${id}" cx="27" cy="27" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`}
function tile(id,color,cap){return `<div class="tile">${ring(id+'-r',color)}<div><div class="num"><span id="${id}-n">—</span><small id="${id}-t"></small></div><div class="cap">${cap}</div></div></div>`}
function count(id,cap){return `<div class="count"><div class="num" id="${id}-n">—</div><div class="cap">${cap}</div></div>`}
document.getElementById('row').innerHTML=
  tile('ch','#5B8DEF','E&amp;T chapters noted')+
  tile('cs','#C9A227','Cases locked in')+
  tile('rv','#D97757','Cards due today')+
  count('ib','Inbox open');
function setRing(id,val,total){
  const n=document.getElementById(id+'-n'),t=document.getElementById(id+'-t'),r=document.getElementById(id+'-r');
  n.textContent=val==null?'—':val; t.textContent=total?` / ${total}`:'';
  const f=(total&&val!=null)?Math.min(1,val/total):0; r.style.strokeDashoffset=C*(1-f);
}
async function load(){
  try{
    const d=await (await fetch('./data.json?t='+Date.now(),{cache:'no-store'})).json();
    setRing('ch',d.reading?.noted,d.reading?.total);
    setRing('cs',d.cases?.locked,d.cases?.total);
    const rv=d.revision||{}; setRing('rv',rv.due_today,rv.total);
    document.getElementById('ib-n').textContent=d.inbox?.open??'—';
    const g=d.generated?new Date(d.generated):null;
    document.getElementById('upd').textContent=g?('updated '+g.toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'})):'';
    document.getElementById('note').textContent=`from the live databases · ${rv.total??0} cards in the queue`;
  }catch(e){
    document.getElementById('note').textContent='no data yet — first refresh runs on the hour';
  }
}
load(); setInterval(load,10*60*1000);
</script>
</body>
</html>
