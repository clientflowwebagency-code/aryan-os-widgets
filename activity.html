<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aryan OS · Activity</title>
<style>
  html,body{height:100%;margin:0;background:transparent}
  .card{position:relative;box-sizing:border-box;min-height:100%;padding:18px 22px 20px;border-radius:12px;overflow:hidden;color:#E8EAF0;
    font-family:-apple-system,"SF Pro Display","Avenir Next","Helvetica Neue",Helvetica,sans-serif;
    background:linear-gradient(135deg,#0B0E13 0%,#161B24 100%)}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 85% at 82% 35%,rgba(124,77,255,.5),transparent 70%),
               radial-gradient(35% 55% at 10% 95%,rgba(217,119,87,.22),transparent 70%)}
  .grain{position:absolute;inset:0;opacity:.09;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .head{position:relative;display:flex;justify-content:space-between;align-items:baseline}
  .label{font:500 10px/1 Menlo,"SF Mono",ui-monospace,monospace;letter-spacing:.32em;color:rgba(232,234,240,.55);text-transform:uppercase}
  .tot{font:400 10px/1 Menlo,"SF Mono",ui-monospace,monospace;color:rgba(232,234,240,.35);letter-spacing:.06em}
  .hair{position:relative;width:96px;height:1px;background:rgba(255,255,255,.12);margin:10px 0 14px}
  .months{position:relative;display:grid;grid-template-columns:repeat(12,13px);gap:3px;margin-bottom:6px}
  .months span{font:400 9px/1 Menlo,"SF Mono",ui-monospace,monospace;color:rgba(232,234,240,.4);letter-spacing:.06em;white-space:nowrap}
  .grid{position:relative;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-template-columns:repeat(12,13px);gap:3px}
  .c{border-radius:2px;background:rgba(255,255,255,.06)}
  .l1{background:rgba(124,77,255,.32)}.l2{background:rgba(124,77,255,.55)}.l3{background:rgba(150,110,255,.8)}.l4{background:#C9B6FF}
  .today{outline:1px solid rgba(255,255,255,.7);outline-offset:-1px}
  .foot{position:relative;display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:rgba(232,234,240,.6)}
  .foot b{color:#E8EAF0;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div><div class="grain"></div>
  <div class="head"><div class="label">Aryan OS · Activity</div><div class="tot" id="tot">last 12 weeks</div></div>
  <div class="hair"></div>
  <div class="months" id="months"></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span id="sum">—</span><span id="streak"></span></div>
</div>
<script>
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function londonYMD(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);return p}
function level(n){return n<=0?'':n<=2?'l1':n<=5?'l2':n<=10?'l3':'l4'}
function render(act){
  const today=new Date(); const todayKey=londonYMD(today);
  // 12 columns of 7 days; last column ends on today's weekday so the grid always fills.
  const dow=(today.getDay()+6)%7; // Monday=0
  const end=new Date(today); end.setDate(today.getDate()+(6-dow));
  const start=new Date(end); start.setDate(end.getDate()-83);
  const grid=document.getElementById('grid'), months=document.getElementById('months');
  grid.innerHTML=''; months.innerHTML='';
  let total=0, cur=0, streak=0, seenToday=false, lastMonth=-1;
  for(let i=0;i<84;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=londonYMD(d); const n=act[key]||0; total+=n;
    const cell=document.createElement('div'); cell.className='c '+level(n); cell.title=`${key} · ${n} edit${n===1?'':'s'}`;
    if(key===todayKey){cell.classList.add('today'); seenToday=true}
    if(d>today) cell.style.visibility='hidden';
    grid.appendChild(cell);
    if(i%7===0){const m=d.getMonth(); const s=document.createElement('span'); s.textContent=(m!==lastMonth)?MON[m]:''; months.appendChild(s); lastMonth=m}
  }
  // streak: consecutive days ending today (or yesterday) with ≥1 edit
  const t=new Date(today); if(!(act[londonYMD(t)]>0)) t.setDate(t.getDate()-1);
  while(act[londonYMD(t)]>0){streak++; t.setDate(t.getDate()-1)}
  document.getElementById('sum').innerHTML=`<b>${total}</b> edits in Notion`;
  document.getElementById('streak').innerHTML=streak?`<b>${streak}</b> day streak`:'';
}
async function load(){
  try{
    const d=await (await fetch('./data.json?t='+Date.now(),{cache:'no-store'})).json();
    render(d.activity||{});
  }catch(e){ render({}); document.getElementById('sum').textContent='no data yet — first refresh runs on the hour'; }
}
load(); setInterval(load,10*60*1000);
</script>
</body>
</html>
